<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Đăng nhập hệ thống quản lý cửa hàng văn phòng phẩm" />
    <title>Đăng nhập | Văn Phòng Phẩm Bách Khoa</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d2939;
        background: #f5f8f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(ellipse at 15% 15%, #e0f2e9 0, transparent 38%),
          radial-gradient(ellipse at 90% 85%, #e7eef9 0, transparent 34%),
          #f8faf9;
      }

      .login-card {
        width: min(100%, 410px);
        padding: 38px;
        border: 1px solid #e6e9e7;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(16 24 40 / 8%);
      }

      .brand-mark {
        display: grid;
        width: 48px;
        height: 48px;
        margin-bottom: 25px;
        place-items: center;
        border-radius: 15px;
        background: #e8f5ef;
        color: #16845b;
        font-size: 25px;
      }

      h1 {
        margin: 0;
        font-size: 25px;
        letter-spacing: -0.8px;
      }

      .subtitle {
        margin: 9px 0 26px;
        color: #667085;
        font-size: 13px;
        line-height: 1.6;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 650;
      }

      input {
        width: 100%;
        border: 1px solid #d0d5dd;
        border-radius: 9px;
        padding: 12px 13px;
        outline-color: #16845b;
        font: inherit;
        font-size: 13px;
      }

      .error {
        margin: 10px 0 0;
        color: #b42318;
        font-size: 12px;
      }

      button {
        width: 100%;
        margin-top: 20px;
        border: 0;
        border-radius: 9px;
        padding: 12px;
        background: #16845b;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
      }

      button:hover {
        background: #116c49;
      }

      .footnote {
        margin: 22px 0 0;
        color: #98a2b3;
        font-size: 11px;
        text-align: center;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 30px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand-mark" aria-hidden="true">⌂</div>
      <h1>Đăng nhập</h1>
      <p class="subtitle">Đăng nhập để tiếp tục vào hệ thống quản lý Văn Phòng Phẩm Bách Khoa.</p>

      <form action="/login" method="post">
        <label for="password">Mật khẩu quản trị</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
        />
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <button type="submit">Đăng nhập</button>
      </form>

      <p class="footnote">Quản lý cửa hàng văn phòng phẩm</p>
    </main>
  </body>
</html>
